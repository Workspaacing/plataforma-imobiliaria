version: 2

updates:
  # Dependências npm de todo o monorepo (workspaces na raiz).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 15
    labels:
      - dependencias
    commit-message:
      # Com `include: scope`, o Dependabot já acrescenta "(deps)" ou "(deps-dev)".
      prefix: "chore"
      include: scope
    groups:
      # Atualizações menores e correções agrupadas em um PR por família.
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "eslint-config-next"
          - "@next/*"
        update-types: [minor, patch]
      supabase:
        patterns:
          - "@supabase/*"
        update-types: [minor, patch]
      shadcn-ui:
        patterns:
          - "shadcn"
          - "@shadcn/*"
          - "@base-ui/*"
          - "lucide-react"
          - "class-variance-authority"
          - "tw-animate-css"
        update-types: [minor, patch]
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "prettier-plugin-tailwindcss"
        update-types: [minor, patch]
      lint-format-types:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "prettier"
          - "typescript"
          - "@types/*"
        update-types: [minor, patch]
      testes:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: [minor, patch]
      demais-menores:
        patterns:
          - "*"
        update-types: [minor, patch]
    # Versões principais (major) chegam em PRs separados, um por pacote,
    # para cada quebra ser revisada com typecheck, lint, testes e build.
    ignore:
      # TypeScript 7 (compilador nativo) ainda quebra o typescript-eslint
      # (peer typescript < 6.1). Remover quando o typescript-eslint suportar o TS 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]
      # ESLint 10 quebra o lint (eslint-plugin-react ainda declara peer eslint <= 9).
      # Remover quando o eslint-plugin-react suportar o ESLint 10; atualizar eslint e
      # @eslint/js juntos.
      - dependency-name: eslint
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]

  # Versões das GitHub Actions usadas nos workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels:
      - dependencias
      - ci
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      actions:
        patterns:
          - "*"
